<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Featured Artists — 3 UI Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --bg-2:#131316; --card:#17171b;
    --red:#ff2d43; --red-deep:#7a1420; --red-soft:rgba(255,45,67,0.14);
    --white:#f6f5f2; --mist:#8d8d94; --line:#242428;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;}
  body{padding-bottom:80px;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  img,svg{display:block;}

  /* ---- switcher ---- */
  .switcher{
    position:sticky;top:0;z-index:50;
    display:flex;gap:6px;justify-content:center;
    padding:18px 16px;background:rgba(10,10,12,0.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .switcher button{
    font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:0.06em;
    color:var(--mist);background:transparent;border:1px solid var(--line);
    padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .25s ease;
  }
  .switcher button.active{color:var(--bg);background:var(--red);border-color:var(--red);}
  .switcher button:hover:not(.active){color:var(--white);border-color:var(--mist);}

  .concept{display:none;padding:70px 6vw 40px;max-width:1360px;margin:0 auto;}
  .concept.active{display:block;}

  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;flex-wrap:wrap;gap:16px;}
  .eyebrow{font-size:11px;letter-spacing:0.22em;color:var(--red);text-transform:uppercase;font-weight:600;margin-bottom:10px;}
  .title{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:700;letter-spacing:-0.01em;}
  .sub{color:var(--mist);font-size:13.5px;max-width:300px;}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1);}
  .reveal.in{opacity:1;transform:translateY(0);}

  /* artist portrait generator */
  .portrait{position:relative;overflow:hidden;background:#000;}
  .portrait .grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;filter:url(#grain);}
  .portrait .mono{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:rgba(255,255,255,0.12);
    font-size:5.5rem;letter-spacing:-0.02em;
  }

  /* ============ CONCEPT 1 — horizontal rail ============ */
  #c1 .rail-wrap{position:relative;}
  .rail{
    display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 22px;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none;}
  .rail-card{
    position:relative;flex:0 0 220px;height:300px;border-radius:22px;scroll-snap-align:start;
    cursor:pointer;transition:transform .45s cubic-bezier(.16,1,.3,1);
  }
  .rail-card:hover{transform:translateY(-8px);}
  .rail-card .portrait{width:100%;height:100%;border-radius:22px;}
  .rail-card .fade{
    position:absolute;inset:0;border-radius:22px;
    background:linear-gradient(180deg,transparent 40%, rgba(0,0,0,0.85) 100%);
  }
  .rail-card .info{position:absolute;left:16px;right:16px;bottom:16px;}
  .rail-card .name{font-size:16px;font-weight:700;}
  .rail-card .genre{font-size:11px;color:var(--mist);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}
  .play-btn{
    position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    background:var(--red);display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.7);transition:all .3s ease;
  }
  .rail-card:hover .play-btn{opacity:1;transform:scale(1);}
  .play-btn svg{width:12px;height:12px;fill:#0a0a0c;}
  .nav-arrows{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
  .arrow-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;
  }
  .arrow-btn:hover{border-color:var(--red);color:var(--red);}

  /* ============ CONCEPT 2 — bento grid ============ */
  .bento{
    display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:16px;
  }
  .bento-card{
    position:relative;border-radius:20px;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);transition:border-color .3s ease, transform .4s cubic-bezier(.16,1,.3,1);
  }
  .bento-card:hover{border-color:var(--red);transform:translateY(-4px);}
  .bento-card.big{grid-column:span 2;grid-row:span 2;}
  .bento-card .portrait{position:absolute;inset:0;transition:transform .6s ease;}
  .bento-card:hover .portrait{transform:scale(1.07);}
  .bento-card .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.88) 100%);}
  .bento-card .info{position:absolute;left:16px;right:16px;bottom:14px;}
  .bento-card.big .name{font-size:22px;}
  .bento-card .name{font-size:14px;font-weight:700;}
  .bento-card .genre{font-size:10.5px;color:var(--mist);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .badge{
    position:absolute;top:12px;left:12px;font-size:9.5px;letter-spacing:.1em;font-weight:600;
    background:var(--red);color:#fff;padding:4px 9px;border-radius:999px;text-transform:uppercase;
  }

  /* ============ CONCEPT 3 — 3D coverflow ============ */
  #c3 .stage{position:relative;height:420px;perspective:1500px;display:flex;align-items:center;justify-content:center;}
  #c3 .ring{position:absolute;width:0;height:0;}
  .cf-card{
    position:absolute;width:190px;height:190px;border-radius:50%;
    will-change:transform,opacity,filter;cursor:pointer;
  }
  .cf-card .portrait{width:100%;height:100%;border-radius:50%;}
  .cf-card .ring-pulse{
    position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--red);
    opacity:0;transition:opacity .4s ease;
  }
  .cf-card.active .ring-pulse{opacity:1;animation:pulseRing 2.2s ease-out infinite;}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,45,67,.35);}100%{box-shadow:0 0 0 18px rgba(255,45,67,0);}}
  .cf-caption{text-align:center;margin-top:18px;opacity:0;transition:opacity .35s ease;}
  .cf-caption.show{opacity:1;}
  .cf-caption .name{font-size:19px;font-weight:700;}
  .cf-caption .genre{font-size:11.5px;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:20px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .3s ease;}
  .dot.active{background:var(--red);width:20px;border-radius:4px;}

  @media(max-width:820px){
    .bento{grid-template-columns:repeat(2,1fr);}
    .bento-card.big{grid-column:span 2;grid-row:span 1;height:220px;}
  }
  @media(max-width:560px){
    .bento{grid-template-columns:1fr 1fr;grid-auto-rows:150px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<nav class="switcher">
  <button class="active" data-target="c1">01 · Rail</button>
  <button data-target="c2">02 · Bento</button>
  <button data-target="c3">03 · Coverflow</button>
</nav>

<!-- shared artist data rendered 3x via JS -->

<section class="concept active" id="c1">
  <div class="head">
    <div>
      <div class="eyebrow">On Rotation</div>
      <h2 class="title disp">Featured Artists</h2>
    </div>
    <p class="sub">A rolling edit of the acts we can't stop playing this week.</p>
  </div>
  <div class="rail-wrap">
    <div class="rail" id="rail1"></div>
    <div class="nav-arrows">
      <button class="arrow-btn" id="railLeft">‹</button>
      <button class="arrow-btn" id="railRight">›</button>
    </div>
  </div>
</section>

<section class="concept" id="c2">
  <div class="head">
    <div>
      <div class="eyebrow">This Week</div>
      <h2 class="title disp">Heavy Rotation</h2>
    </div>
    <p class="sub">One name leading, the rest holding the room.</p>
  </div>
  <div class="bento" id="bento"></div>
</section>

<section class="concept" id="c3">
  <div class="head" style="justify-content:center;text-align:center;">
    <div>
      <div class="eyebrow">Spotlight</div>
      <h2 class="title disp">Featured Artists</h2>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="cf-caption" id="cfCaption">
    <div class="name" id="cfName"></div>
    <div class="genre" id="cfGenre"></div>
  </div>
  <div class="dots" id="cfDots"></div>
</section>

<script>
(function(){
"use strict";
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const artists = [
  {name:'Kessy Vane', genre:'Afrobeats', angle:18},
  {name:'NOVA Sol', genre:'Amapiano', angle:200},
  {name:'Dàmilare', genre:'Afro-Soul', angle:45},
  {name:'Lagoon Boy', genre:'Street Pop', angle:160},
  {name:'Mirèio', genre:'Afro-Fusion', angle:280},
  {name:'Chike Nova', genre:'R&B', angle:95},
  {name:'Sade Row', genre:'Alté', angle:230},
  {name:'Témi Blaze', genre:'Afrobeats', angle:320},
];

function portraitHTML(a,i){
  const hue = (i*47)%360;
  const bg = `linear-gradient(145deg, hsl(${hue} 70% 14%) 0%, #0a0a0c 55%, hsl(0 85% 30%) 130%)`;
  return `<div class="portrait" style="background:${bg}">
            <div class="grain"></div>
            <div class="mono">${a.name.charAt(0)}</div>
          </div>`;
}

/* ---- Concept 1: rail ---- */
const rail1 = document.getElementById('rail1');
artists.forEach((a,i)=>{
  const el = document.createElement('div');
  el.className = 'rail-card reveal';
  el.innerHTML = `${portraitHTML(a,i)}
    <div class="fade"></div>
    <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></div>
    <div class="info"><div class="name disp">${a.name}</div><div class="genre">${a.genre}</div></div>`;
  rail1.appendChild(el);
});
document.getElementById('railLeft').onclick = ()=> rail1.scrollBy({left:-240,behavior:'smooth'});
document.getElementById('railRight').onclick = ()=> rail1.scrollBy({left:240,behavior:'smooth'});

/* ---- Concept 2: bento ---- */
const bento = document.getElementById('bento');
artists.slice(0,7).forEach((a,i)=>{
  const el = document.createElement('div');
  el.className = 'bento-card reveal' + (i===0 ? ' big' : '');
  el.innerHTML = `${portraitHTML(a,i)}
    <div class="scrim"></div>
    ${i===0 ? '<span class="badge">Artist of the Week</span>' : (i%3===1 ? '<span class="badge">New</span>' : '')}
    <div class="info"><div class="name disp">${a.name}</div><div class="genre">${a.genre}</div></div>`;
  bento.appendChild(el);
});

/* ---- Concept 3: coverflow ---- */
const stage = document.getElementById('stage');
const cfCards = artists.map((a,i)=>{
  const el = document.createElement('div');
  el.className = 'cf-card';
  el.innerHTML = `<div class="ring-pulse"></div>${portraitHTML(a,i)}`;
  stage.appendChild(el);
  return el;
});
const dotsWrap = document.getElementById('cfDots');
artists.forEach((_,i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' active':'');
  d.onclick = ()=>{ activeIdx = i; renderCF(); };
  dotsWrap.appendChild(d);
});
let activeIdx = 0;
function renderCF(){
  const n = artists.length;
  cfCards.forEach((card,i)=>{
    let diff = i - activeIdx;
    if(diff > n/2) diff -= n;
    if(diff < -n/2) diff += n;
    const abs = Math.abs(diff);
    const x = diff * 150;
    const z = -abs * 110;
    const scale = abs===0 ? 1 : Math.max(0.55, 1 - abs*0.22);
    const opacity = abs > 3 ? 0 : 1 - abs*0.22;
    card.style.transform = `translateX(${x}px) translateZ(${z}px) scale(${scale})`;
    card.style.opacity = opacity;
    card.style.zIndex = 100 - abs;
    card.style.filter = abs===0 ? 'none' : `brightness(${1-abs*0.12})`;
    card.classList.toggle('active', diff===0);
  });
  document.getElementById('cfName').textContent = artists[activeIdx].name;
  document.getElementById('cfGenre').textContent = artists[activeIdx].genre;
  document.getElementById('cfCaption').classList.add('show');
  [...dotsWrap.children].forEach((d,i)=>d.classList.toggle('active', i===activeIdx));
}
cfCards.forEach((card,i)=> card.addEventListener('click', ()=>{ activeIdx=i; renderCF(); }));
renderCF();
let cfTimer = reduceMotion ? null : setInterval(()=>{ activeIdx=(activeIdx+1)%artists.length; renderCF(); }, 3200);
stage.addEventListener('mouseenter', ()=> clearInterval(cfTimer));
stage.addEventListener('mouseleave', ()=>{ if(!reduceMotion) cfTimer = setInterval(()=>{ activeIdx=(activeIdx+1)%artists.length; renderCF(); }, 3200); });

/* ---- switcher ---- */
document.querySelectorAll('.switcher button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.switcher button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.concept').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.target).classList.add('active');
    revealAll();
  });
});

/* ---- scroll/entrance reveal ---- */
function revealAll(){
  document.querySelectorAll('.reveal').forEach((el,i)=>{
    setTimeout(()=> el.classList.add('in'), reduceMotion ? 0 : i*45);
  });
}
revealAll();
})();
</script>
</body>
</html>
